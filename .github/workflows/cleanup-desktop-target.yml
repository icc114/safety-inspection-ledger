name: Cleanup generated PC build files

on:
  push:
    branches: [agent/v1216-pc-client]
    paths: ['.github/workflows/cleanup-desktop-target.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1216-pc-client
      - name: Remove generated desktop target and ignore it
        run: |
          git rm -r --ignore-unmatch desktop/target
          touch .gitignore
          grep -qxF 'desktop/target/' .gitignore || printf '\ndesktop/target/\n' >> .gitignore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .gitignore
          git commit -m 'Remove generated Windows build output from source' || exit 0
          git push origin HEAD:agent/v1216-pc-client
