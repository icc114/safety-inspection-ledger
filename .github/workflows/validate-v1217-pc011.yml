name: Validate Android 1.2.17 and PC 0.1.1

on:
  push:
    branches: [agent/pc-preview-v011]
    paths:
      - 'tools/apply_v1217_pc011.py'
      - 'desktop/src/main/java/cn/safetyledger/pc/RecordPreviewDialog.java'
      - '.github/workflows/validate-v1217-pc011.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-preview-v011
      - name: Apply source patch
        run: python3 tools/apply_v1217_pc011.py
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app desktop
          git commit -m 'Android 1.2.17 import compatibility and PC 0.1.1 preview'
          git push origin HEAD:agent/pc-preview-v011

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-preview-v011
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test lint and build Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify Android version
        run: $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep "versionCode='20' versionName='1.2.17'"
      - uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.17-待永久签名
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-preview-v011
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test PC client
        run: mvn -B -f desktop/pom.xml test package
      - name: Build Windows app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/target/jpackage-input | Out-Null
          Copy-Item desktop/target/safety-ledger-pc-0.1.1-all.jar desktop/target/jpackage-input/
          jpackage --type app-image --name SafetyLedgerPC --app-version 0.1.1 --vendor "Safety Ledger" --input desktop/target/jpackage-input --main-jar safety-ledger-pc-0.1.1-all.jar --main-class cn.safetyledger.pc.SafetyLedgerDesktop --dest desktop/target/windows
          Compress-Archive -Path desktop/target/windows/SafetyLedgerPC -DestinationPath "desktop/target/安全检查台账-PC-0.1.1-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-PC-0.1.1-Windows
          path: desktop/target/安全检查台账-PC-0.1.1-Windows.zip
          retention-days: 30
