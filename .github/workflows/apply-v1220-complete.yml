name: Apply Android 1.2.20 and PC 0.1.3 complete fixes

on:
  push:
    branches:
      - agent/v1220-complete-android-pc

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply consolidated product fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, pairs):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(text, encoding='utf-8')

          patch('app/src/main/java/cn/safetyledger/app/TemplateActivity.java', [
              ('private static final int MAX_TEMPLATE_ITEMS = 9;', 'private static final int MAX_TEMPLATE_ITEMS = 12;'),
              ('每个模板最多 9 个检查项目，以保证导出 A4 第1页包含完整检查表和签名', '每个模板最多 12 个检查项目，以保证导出 A4 第1页包含完整检查表、整改意见、整改记录和签名'),
              ('版式限制：最多 9 个检查项目；检查内容最多 100 字，检查标准最多 60 字。正式 PDF 会根据单元格文字量自动调整字号，优先保证第1页检查表、整改意见、整改记录和签名完整，第2页起只放检查/整改照片。', '版式限制：最多 12 个检查项目；检查内容最多 100 字，检查标准最多 60 字。第1页固定保留检查表、整改意见、整改记录和三方签名；单元格会按文字量自动缩放字号，所有检查/整改/复查照片从第2页开始。'),
              ('当前模板已达到 9 个检查项目上限', '当前模板已达到 12 个检查项目上限'),
          ])

          patch('app/src/main/java/cn/safetyledger/app/pdf/PdfExporter.java', [
              ('private static final int FORM_ITEM_SLOTS = 9;', 'private static final int FORM_ITEM_SLOTS = 12;'),
              ('Bitmap bitmap = decodeForPdf(media.localPath, 900, 1100, false);', 'Bitmap bitmap = decodeForPdf(media.localPath, 720, 900, false);'),
          ])

          patch('desktop/src/main/java/cn/safetyledger/pc/WordExporter.java', [
              ('public static final int LAYOUT_VERSION = 4;', 'public static final int LAYOUT_VERSION = 5;'),
              ('int layoutRows = realCount == 0 ? 1 : Math.max(9, realCount);', 'int layoutRows = realCount == 0 ? 1 : Math.max(12, realCount);'),
              ('int rowHeight = 10560 / layoutRows;', 'int rowHeight = 10440 / layoutRows;'),
              ('int itemFont = Math.max(6, Math.min(11, (int) Math.round((rowHeight / 20.0) * 0.22)));', 'int itemFont = Math.max(7, Math.min(10, (int) Math.floor((rowHeight / 20.0) * 0.20)));'),
              ('for (XWPFTableRow row : table.getRows()) exactRow(row, 840);', 'for (XWPFTableRow row : table.getRows()) exactRow(row, 900);'),
          ])

          patch('desktop/src/test/java/cn/safetyledger/pc/WordExporterTest.java', [
              ('wordFormUsesFixedNineSlotA4FirstPageStructure', 'wordFormUsesFixedTwelveSlotA4FirstPageStructure'),
              ('// Header + nine fixed item slots. Adding the ninth item must not shrink earlier rows.', '// Header + twelve fixed item slots. Adding items up to twelve must not change earlier row heights.'),
              ('assertEquals(10, doc.getTables().get(1).getRows().size());', 'assertEquals(13, doc.getTables().get(1).getRows().size());'),
              ('assertTrue(rowText(doc.getTables().get(1).getRow(9)).isBlank());', 'assertTrue(rowText(doc.getTables().get(1).getRow(12)).isBlank());'),
          ])

          patch('desktop/src/main/java/cn/safetyledger/pc/SafetyLedgerDesktop.java', [
              ('private void showError(String title,Throwable error){String msg=error.getMessage()==null?error.getClass().getSimpleName():error.getMessage();setStatus(title+"："+msg);JOptionPane.showMessageDialog(this,msg,title,JOptionPane.ERROR_MESSAGE);}',
               'private void showError(String title,Throwable error){String msg=friendlyError(error);setStatus(title+"："+msg);JOptionPane.showMessageDialog(this,msg,title,JOptionPane.ERROR_MESSAGE);}\n    private static String friendlyError(Throwable error){String fallback=error==null?"未知错误":error.getClass().getSimpleName();for(Throwable current=error;current!=null;current=current.getCause()){String m=current.getMessage();if(m!=null&&!m.isBlank())fallback=m;String s=m==null?"":m.toLowerCase(Locale.ROOT);if(current instanceof java.net.ConnectException||current instanceof java.net.UnknownHostException||current instanceof java.net.http.HttpTimeoutException||s.contains("failed to connect")||s.contains("timed out")||s.contains("timeout")||s.contains("unable to resolve")||s.contains("network is unreachable")||s.contains("no route to host"))return "网络连接问题：暂时无法连接云同步服务器。请检查电脑网络、VPN/代理和云同步地址后重试；电脑本地资料不会因此丢失。";}return fallback;}'),
          ])

          patch('desktop/src/main/java/cn/safetyledger/pc/RecordPreviewDialog.java', [
              ('JLabel title = new JLabel(blank(record.templateName, "安全检查") + "记录");', 'JLabel title = new JLabel(formTitle(record.templateName));'),
              ('    private static String shortId(String id) {', '    private static String formTitle(String value) {\n        String title = blank(value, "安全检查").trim();\n        if (title.endsWith("记录表")) return title;\n        if (title.endsWith("记录")) return title + "表";\n        return title + "记录表";\n    }\n\n    private static String shortId(String id) {'),
          ])

          patch('app/src/main/java/cn/safetyledger/app/LedgerActivity.java', [
              ('import cn.safetyledger.app.pdf.PdfExporter;', 'import cn.safetyledger.app.pdf.PdfExporter;\nimport cn.safetyledger.app.sync.CloudSyncScheduler;'),
              ('    private void render() {', '    @Override\n    protected void onResume() {\n        super.onResume();\n        if (repo != null) {\n            CloudSyncScheduler.scheduleTrashSoon(this);\n            refreshTypeFilter();\n            load();\n        }\n    }\n\n    private void render() {'),
          ])

          patch('app/build.gradle', [
              ("versionCode 22", "versionCode 23"),
              ("versionName '1.2.19'", "versionName '1.2.20'"),
          ])

          patch('desktop/pom.xml', [
              ('<version>0.1.2</version>', '<version>0.1.3</version>'),
              ('<finalName>safety-ledger-pc-0.1.2-all</finalName>', '<finalName>safety-ledger-pc-0.1.3-all</finalName>'),
          ])

          patch('.github/workflows/android-build.yml', [
              ("安全检查台账-1.2.19-debug-不可作为长期升级包.apk", "安全检查台账-1.2.20-debug-不可作为长期升级包.apk"),
              ('name: 安全检查台账-1.2.19-debug', 'name: 安全检查台账-1.2.20-debug'),
          ])

          patch('.github/workflows/android-release.yml', [
              ("安全检查台账-1.2.19-正式签名.apk", "安全检查台账-1.2.20-正式签名.apk"),
              ('name: 安全检查台账-1.2.19-正式签名', 'name: 安全检查台账-1.2.20-正式签名'),
          ])

          patch('.github/workflows/windows-pc-build.yml', [
              ('safety-ledger-pc-0.1.2-all.jar', 'safety-ledger-pc-0.1.3-all.jar'),
              ('--app-version 0.1.2', '--app-version 0.1.3'),
              ('安全检查台账-PC-0.1.2-Windows.zip', '安全检查台账-PC-0.1.3-Windows.zip'),
              ('name: 安全检查台账-PC-0.1.2-Windows', 'name: 安全检查台账-PC-0.1.3-Windows'),
          ])

          Path('docs/release-1.2.20-complete.md').write_text('''# 安全检查台账 1.2.20 / PC 0.1.3 完整修改\n\n- Android 模板最多 12 个检查项目，固定 12 个 A4 项目槽位，增加项目时前面单元格不再反复改变高度。\n- 检查内容最多 100 字、标准最多 60 字；PDF 单元格按文字量自动缩放。\n- PDF 第 1 页只保留检查表、整改意见、整改记录、三方签名；删除“共检查几项/是几项/否几项”的检查情况汇总。\n- 第 2 页起为照片附件，顺序为检查照片 → 整改照片 → 复查照片。\n- 图片只在存在原始拍摄时间/可解析中文地点时写水印；不把 GPS 数字作为地点文字。\n- PDF 照片嵌入尺寸下调到 720×900 上限，降低导出文件体积。\n- 回收站永久删除统一验证云同步空间密码；使用轻量 trash 指令和 30 天云端回收站，管理员可按日期、时间、模板、地点查看并恢复。\n- APP 回到台账首页时会立即安排一次轻量回收站状态检查，后台仍保留 15 分钟兜底。\n- 网络超时/无法连接统一显示“网络连接问题”，不再直接暴露英文连接错误。\n- 自动归档开关保留：只清理超过 6 个月且已完成记录的未处理原图副本，不删除检查记录、水印业务照片、签名或整改资料。\n- PC 本地资料库继续按 年/月/日期/序号 建目录，保存检查照片、整改照片、复查照片、签名、record.json 和可编辑 Word。\n- PC Word 布局按 Android A4 PDF 的同一列宽和高度比例重做；版本升级后自动重绘未人工修改的旧 Word，人工修改过的保留并生成“系统更新”版。\n- PC 点击“检查记录”或双击记录可弹窗预览；网络错误改为中文可操作提示。\n- `.safetydata` 继续支持 Android、其他手机和 PC 之间导入导出。\n''', encoding='utf-8')
          PY
      - name: Verify Android source changes
        run: |
          grep -F 'MAX_TEMPLATE_ITEMS = 12' app/src/main/java/cn/safetyledger/app/TemplateActivity.java
          grep -F 'FORM_ITEM_SLOTS = 12' app/src/main/java/cn/safetyledger/app/pdf/PdfExporter.java
          grep -F "versionName '1.2.20'" app/build.gradle
      - name: Verify PC source changes
        run: |
          grep -F 'LAYOUT_VERSION = 5' desktop/src/main/java/cn/safetyledger/pc/WordExporter.java
          grep -F 'Math.max(12, realCount)' desktop/src/main/java/cn/safetyledger/pc/WordExporter.java
          grep -F '<version>0.1.3</version>' desktop/pom.xml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - name: Android test lint build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: PC tests
        run: mvn -B -f desktop/pom.xml test package
      - name: Commit consolidated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app desktop docs .github/workflows/android-build.yml .github/workflows/android-release.yml .github/workflows/windows-pc-build.yml
          git commit -m 'Finalize Android 1.2.20 and PC 0.1.3' || exit 0
          git push
