name: Build current Android 1.2.17 and PC 0.1.1

on:
  push:
    branches: [agent/pc-preview-v011]
    paths: ['.github/workflows/validate-current-v1217-pc011.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-preview-v011
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test lint and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify version
        run: $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep "versionCode='20' versionName='1.2.17'"
      - uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.17-待永久签名
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-preview-v011
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package
        run: mvn -B -f desktop/pom.xml test package
      - name: Build Windows app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/target/jpackage-input | Out-Null
          Copy-Item desktop/target/safety-ledger-pc-0.1.1-all.jar desktop/target/jpackage-input/
          jpackage --type app-image --name SafetyLedgerPC --app-version 0.1.1 --vendor "Safety Ledger" --input desktop/target/jpackage-input --main-jar safety-ledger-pc-0.1.1-all.jar --main-class cn.safetyledger.pc.SafetyLedgerDesktop --dest desktop/target/windows
          Compress-Archive -Path desktop/target/windows/SafetyLedgerPC -DestinationPath "desktop/target/安全检查台账-PC-0.1.1-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-PC-0.1.1-Windows
          path: desktop/target/安全检查台账-PC-0.1.1-Windows.zip
          retention-days: 30
