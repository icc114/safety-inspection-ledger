name: Apply 1.2.25 Source Changes

on:
  push:
    branches:
      - 'agent/v1225-ui-sync-diagnostics'
    paths:
      - 'tools/apply_v1225.py'
      - '.github/workflows/apply-v1225-source-changes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1225-ui-sync-diagnostics
          fetch-depth: 0
      - name: Apply deterministic source migration
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v1225.py
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/Ui.java \
                  app/src/main/java/cn/safetyledger/app/LedgerActivity.java \
                  app/src/main/java/cn/safetyledger/app/SettingsActivity.java \
                  app/src/main/java/cn/safetyledger/app/sync/CloudSyncService.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m "Fix compact Android layout and add sync diagnostics"
          git push origin HEAD:agent/v1225-ui-sync-diagnostics
