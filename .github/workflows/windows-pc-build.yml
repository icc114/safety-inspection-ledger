name: Windows PC Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile standalone Android-PC data tool
        run: javac -encoding UTF-8 tools/SafetyDataTool.java
      - name: Test and build PC client
        run: mvn -B -f desktop/pom.xml test package
