name: Windows PC Build

on:
  push:
    branches: ['**']
    paths:
      - 'desktop/**'
      - 'tools/SafetyDataTool.java'
      - '.github/workflows/windows-pc-build.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'tools/SafetyDataTool.java'
      - '.github/workflows/windows-pc-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile standalone Android-PC data tool
        run: javac -encoding UTF-8 tools/SafetyDataTool.java
      - name: Test and build PC client
        run: mvn -B -f desktop/pom.xml test package
      - name: Build portable Windows app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/target/jpackage-input | Out-Null
          Copy-Item desktop/target/safety-ledger-pc-0.2.0-all.jar desktop/target/jpackage-input/
          jpackage --type app-image --name SafetyLedgerPC --app-version 0.2.0 --vendor "Safety Ledger" --input desktop/target/jpackage-input --main-jar safety-ledger-pc-0.2.0-all.jar --main-class cn.safetyledger.pc.SafetyLedgerDesktop --dest desktop/target/windows
          Compress-Archive -Path desktop/target/windows/SafetyLedgerPC -DestinationPath "desktop/target/安全检查台账-PC-0.2.0-Windows.zip" -Force
      - name: Upload Windows client
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-PC-0.2.0-Windows
          path: desktop/target/安全检查台账-PC-0.2.0-Windows.zip
          if-no-files-found: error
          retention-days: 30
