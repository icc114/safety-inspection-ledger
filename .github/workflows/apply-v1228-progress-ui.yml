    }

    private String compactProgressName(String name) {
        if (name == null || name.isBlank()) return "未命名";
        String value = name.replace("检查", "").replace("记录表", "").trim();
        return value.length() > 6 ? value.substring(0, 6) + "…" : value;
    }

