name: Apply 1.2.28 Progress UI

on:
  push:
    branches:
      - 'agent/v1226-ui-sync-smoothing'
    paths:
      - '.github/migrate-v1228.py'
      - '.github/workflows/apply-v1228-progress-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1226-ui-sync-smoothing
          fetch-depth: 0
      - name: Apply monthly plan and compact controls
        run: python3 .github/migrate-v1228.py
      - name: Test and build
        run: |
          chmod +x gradlew
          ./gradlew test lintDebug assembleDebug assembleRelease --no-daemon
      - name: Commit app changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo 'No app changes.'
            exit 0
          fi
          git commit -m 'Add monthly inspection plans and compact Android UI'
          git push origin HEAD:agent/v1226-ui-sync-smoothing
