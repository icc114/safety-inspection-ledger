name: Apply Android 1.2.16

on:
  workflow_dispatch:
  push:
    branches: [agent/v1216-pc-client]
    paths:
      - 'tools/apply_v1216_android.py'
      - '.github/workflows/apply-v1216-android.yml'

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1216-pc-client
      - name: Apply Android patch
        run: python3 tools/apply_v1216_android.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test lint build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Commit verified Android 1.2.16 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          git commit -m 'Android 1.2.16 protected deletion and admin recovery' || exit 0
          git push origin HEAD:agent/v1216-pc-client
