name: Apply 1.2.33 Final Progress Dashboard

on:
  push:
    branches:
      - 'agent/v1233-final-progress-dashboard'
    paths:
      - 'tools/apply-v1233-final-progress-layout.py'
      - '.github/workflows/apply-v1233-final-progress.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1233-final-progress-dashboard
          fetch-depth: 0
      - name: Apply final progress dashboard changes
        run: python3 tools/apply-v1233-final-progress-layout.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/LedgerActivity.java \
                  app/src/main/java/cn/safetyledger/app/MonthlyPlanActivity.java \
                  app/src/main/java/cn/safetyledger/app/DonutProgressView.java \
                  app/src/main/java/cn/safetyledger/app/SegmentedProgressView.java \
                  app/build.gradle app/VERSION_1.2.33.txt tools/README-v1233-temp.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Finalize adaptive monthly progress dashboard 1.2.33"
          git push origin HEAD:agent/v1233-final-progress-dashboard
