name: Android 1.2.16 Signed Release Once

on:
  push:
    branches: [agent/native-android-v1]
    paths: ['.github/workflows/release-v1216-once.yml']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAFETY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SAFETY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SAFETY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_CERT_SHA256: "0E:D4:37:B3:AB:D1:2F:BC:62:88:91:C8:1C:FF:15:06:72:D0:AD:A7:8C:C6:6D:11:72:08:59:EC:C9:F5:28:15"
    steps:
      - uses: actions/checkout@v4
      - name: Restore permanent release key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$SAFETY_KEYSTORE_PASSWORD"
          test -n "$SAFETY_KEY_ALIAS"
          test -n "$SAFETY_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/safety-ledger-release.jks"
          chmod 600 "$RUNNER_TEMP/safety-ledger-release.jks"
          echo "SAFETY_KEYSTORE_PATH=$RUNNER_TEMP/safety-ledger-release.jks" >> "$GITHUB_ENV"
      - name: Verify permanent signing fingerprint
        run: |
          keytool -list -v -keystore "$SAFETY_KEYSTORE_PATH" -storepass "$SAFETY_KEYSTORE_PASSWORD" -alias "$SAFETY_KEY_ALIAS" > "$RUNNER_TEMP/key-info.txt"
          grep -F "SHA256: $EXPECTED_CERT_SHA256" "$RUNNER_TEMP/key-info.txt" >/dev/null
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test lint and build signed release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify signed APK certificate and version
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apk-cert.txt"
          NORMALIZED=$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          grep -F "Signer #1 certificate SHA-256 digest: $NORMALIZED" "$RUNNER_TEMP/apk-cert.txt" >/dev/null
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk | grep "versionCode='19' versionName='1.2.16'"
      - name: Name stable APK
        run: cp app/build/outputs/apk/release/app-release.apk '安全检查台账-1.2.16-正式签名.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.16-正式签名
          path: 安全检查台账-1.2.16-正式签名.apk
          if-no-files-found: error
          retention-days: 30
