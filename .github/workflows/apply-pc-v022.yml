name: Apply PC 0.2.2 UI and Sync

on:
  push:
    branches:
      - agent/pc-v022-mobile-ui-sync-log-final
    paths:
      - tools/apply-pc-v022-ui-sync.py
      - .github/workflows/apply-pc-v022.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-v022-mobile-ui-sync-log-final
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply PC 0.2.2 source changes
        run: python tools/apply-pc-v022-ui-sync.py
      - name: Verify desktop tests and package
        run: mvn -f desktop/pom.xml --batch-mode test package
      - name: Commit generated source changes
        run: |
          git config user.name "icc114"
          git config user.email "75865808+icc114@users.noreply.github.com"
          git add desktop
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "PC 0.2.2 mobile-style UI and resilient sync logs"
            git push origin HEAD:agent/pc-v022-mobile-ui-sync-log-final
          fi
