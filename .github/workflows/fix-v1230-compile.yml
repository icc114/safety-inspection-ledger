name: Fix 1.2.30 Compile

on:
  push:
    branches:
      - 'agent/v1230-weekly-miss-dashboard'
    paths:
      - 'tools/fix-v1230-compile.py'
      - '.github/workflows/fix-v1230-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1230-weekly-miss-dashboard
          fetch-depth: 0
      - run: python3 tools/fix-v1230-compile.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/LedgerActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix 1.2.30 dashboard text size compile"
          git push origin HEAD:agent/v1230-weekly-miss-dashboard
