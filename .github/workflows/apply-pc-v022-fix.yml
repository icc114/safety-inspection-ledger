name: Fix PC 0.2.2 Migration

on:
  push:
    branches:
      - agent/pc-v022-mobile-ui-sync-log-final
    paths:
      - .github/workflows/apply-pc-v022-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pc-v022-mobile-ui-sync-log-final
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Apply migration and repair method boundaries
        run: |
          python tools/apply-pc-v022-ui-sync.py
          python - <<'PY'
          from pathlib import Path
          p = Path('desktop/src/main/java/cn/safetyledger/pc/SafetyLedgerDesktop.java')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    private void clearFilters()    private void clearFilters(){', '    private void clearFilters(){')
          s = s.replace('    private void importPackage()    private void importPackage(){', '    private void importPackage(){')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify desktop tests and package
        run: mvn -f desktop/pom.xml --batch-mode test package
      - name: Commit PC 0.2.2 source
        run: |
          git config user.name "icc114"
          git config user.email "75865808+icc114@users.noreply.github.com"
          git add desktop
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "PC 0.2.2 mobile UI, sync retries and diagnostics"
            git push origin HEAD:agent/pc-v022-mobile-ui-sync-log-final
          fi
