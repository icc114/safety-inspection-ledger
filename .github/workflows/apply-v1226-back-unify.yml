name: Apply 1.2.26 Back Button Unification

on:
  push:
    branches:
      - 'agent/v1226-ui-sync-smoothing'
    paths:
      - '.github/workflows/apply-v1226-back-unify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1226-ui-sync-smoothing
          fetch-depth: 0
      - name: Replace custom back controls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for path in [
              Path('app/src/main/java/cn/safetyledger/app/MainActivity.java'),
              Path('app/src/main/java/cn/safetyledger/app/RecordDetailActivity.java'),
          ]:
              text = path.read_text(encoding='utf-8')
              old = '''        Button back = Ui.secondaryButton(this, "‹");\n        back.setTextSize(22);\n        back.setOnClickListener(view -> finish());'''
              new = '''        TextView back = Ui.backButton(this);'''
              if old in text:
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  print('updated', path)
              elif 'TextView back = Ui.backButton(this);' in text:
                  print('already updated', path)
              else:
                  raise SystemExit(f'custom back block not found in {path}')
          PY
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/MainActivity.java app/src/main/java/cn/safetyledger/app/RecordDetailActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Use shared dimensional back button on remaining screens"
          git push origin HEAD:agent/v1226-ui-sync-smoothing
