name: Apply 1.2.26 Source Changes

on:
  push:
    branches:
      - 'agent/v1226-ui-sync-smoothing'
    paths:
      - 'tools/v1226-ui.patch'
      - 'tools/v1226-sync.patch'
      - '.github/workflows/apply-v1226-source-changes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1226-ui-sync-smoothing
          fetch-depth: 0
      - name: Apply approved patches once
        shell: bash
        run: |
          set -euo pipefail
          apply_once() {
            local patch="$1"
            if git apply --check "$patch"; then
              git apply "$patch"
            elif git apply --reverse --check "$patch"; then
              echo "$patch already applied"
            else
              echo "Cannot apply or recognize $patch" >&2
              exit 1
            fi
          }
          apply_once tools/v1226-ui.patch
          apply_once tools/v1226-sync.patch
      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/LedgerActivity.java \
                  app/src/main/java/cn/safetyledger/app/SettingsActivity.java \
                  app/src/main/java/cn/safetyledger/app/sync/CloudSyncService.java \
                  app/src/main/java/cn/safetyledger/app/sync/WebDavClient.java
          if git diff --cached --quiet; then
            echo "Source patches already applied."
            exit 0
          fi
          git commit -m "Apply 1.2.26 UI and sync smoothing changes"
          git push origin HEAD:agent/v1226-ui-sync-smoothing
