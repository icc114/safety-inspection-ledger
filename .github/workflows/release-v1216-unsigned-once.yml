name: Android 1.2.16 Unsigned Release Once

on:
  push:
    branches: [agent/native-android-v1]
    paths: ['.github/workflows/release-v1216-unsigned-once.yml']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test lint and build unsigned release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Verify version and collect unsigned APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "versionCode='19' versionName='1.2.16'"
          cp "$APK" '安全检查台账-1.2.16-待永久签名.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.16-待永久签名
          path: 安全检查台账-1.2.16-待永久签名.apk
          if-no-files-found: error
          retention-days: 7
