name: One-time unsigned 1.2.12 release

on:
  push:
    branches:
      - agent/v1212-device-management-ui

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test, lint and build release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Collect unsigned release APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk '安全检查台账-1.2.12-unsigned.apk'
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.12-unsigned
          path: 安全检查台账-1.2.12-unsigned.apk
          if-no-files-found: error
          retention-days: 7
