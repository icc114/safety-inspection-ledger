name: Apply Android 1.2.19 form layout

on:
  push:
    branches: [agent/pc-word-pdf-layout-v012]
    paths:
      - 'tools/apply_layout_v1219.py'
      - '.github/workflows/apply-layout-v1219.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/pc-word-pdf-layout-v012
          fetch-depth: 0
      - name: Apply form layout patch
        run: python tools/apply_layout_v1219.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Verify PC Word export
        run: mvn -f desktop/pom.xml -B test package
      - name: Commit verified source
        run: |
          # The patch script also refreshes release artifact labels, but this Actions token
          # intentionally has no workflow-write permission. Revert those two metadata-only
          # files here; source changes are committed below after all tests pass.
          git checkout -- .github/workflows/android-build.yml .github/workflows/android-release.yml
          if git diff --quiet; then
            echo 'Source already patched; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+icc114@users.noreply.github.com'
          git add app desktop
          git commit -m 'Android 1.2.19 simplify first-page rectification layout'
          git push origin HEAD:agent/pc-word-pdf-layout-v012
