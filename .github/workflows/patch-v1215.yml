name: Patch v1.2.15 split device and content sync

on:
  push:
    branches:
      - agent/split-device-content-sync-v1215
    paths:
      - tools/patch_v1215_split_sync_pdf.py
      - tools/patch_v1215_escape_fix.py
      - .github/workflows/patch-v1215.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/split-device-content-sync-v1215
      - name: Apply v1.2.15 patch
        run: |
          python3 tools/patch_v1215_split_sync_pdf.py
          python3 tools/patch_v1215_escape_fix.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Collect unsigned release APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk '安全检查台账-1.2.15-unsigned.apk'
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.15-unsigned
          path: 安全检查台账-1.2.15-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle \
            app/src/main/java/cn/safetyledger/app/SettingsActivity.java \
            app/src/main/java/cn/safetyledger/app/MainActivity.java \
            app/src/main/java/cn/safetyledger/app/backup/BackupService.java \
            app/src/main/java/cn/safetyledger/app/media/MediaService.java \
            app/src/main/java/cn/safetyledger/app/pdf/PdfExporter.java \
            app/src/main/java/cn/safetyledger/app/sync/CloudSyncService.java \
            app/src/main/java/cn/safetyledger/app/sync/CloudSyncJobService.java \
            app/src/main/java/cn/safetyledger/app/sync/CloudSyncScheduler.java \
            app/src/main/java/cn/safetyledger/app/sync/WebDavClient.java
          if git diff --cached --quiet; then
            echo 'No app source changes to commit.'
          else
            git commit -m 'Release 1.2.15 with split device/content sync and PDF photo ordering'
            git push origin HEAD:agent/split-device-content-sync-v1215
          fi
