name: One-time unsigned 1.2.11 release

on:
  push:
    branches:
      - agent/native-android-v1

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test, lint and build release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Collect unsigned release APK
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -1)
          test -n "$APK" || (echo 'Release APK not found' && exit 1)
          cp "$APK" '安全检查台账-1.2.11-unsigned.apk'
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.11-unsigned
          path: 安全检查台账-1.2.11-unsigned.apk
          if-no-files-found: error
          retention-days: 7
