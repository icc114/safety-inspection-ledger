name: Patch v1.2.12 device management UI

on:
  push:
    branches:
      - agent/v1212-device-management-ui

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.2.12 patch
        run: python3 tools/patch_v1212.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test lint build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Commit verified app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/cn/safetyledger/app/SettingsActivity.java
          git diff --cached --quiet || git commit -m 'Release 1.2.12 visible paired-device management'
          git push
