name: Finalize v1.2.15 split sync

on:
  push:
    branches:
      - agent/split-device-content-sync-v1215
    paths:
      - tools/finalize_v1215.py
      - .github/workflows/finalize-v1215.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/split-device-content-sync-v1215
      - name: Apply final efficiency changes
        run: python3 tools/finalize_v1215.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.15-final-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified final source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/cn/safetyledger/app/backup/BackupService.java \
            app/src/main/java/cn/safetyledger/app/sync/CloudSyncService.java
          if git diff --cached --quiet; then
            echo 'No final changes to commit.'
          else
            git commit -m 'Avoid duplicate content snapshot uploads'
            git push origin HEAD:agent/split-device-content-sync-v1215
          fi
