name: Apply 1.2.27 UI Polish V4

on:
  push:
    branches: ['agent/v1226-ui-sync-smoothing']
    paths: ['.github/workflows/apply-v1227-ui-polish-v4.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1226-ui-sync-smoothing
          fetch-depth: 0
      - name: Apply visual polish
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui=Path('app/src/main/java/cn/safetyledger/app/Ui.java')
          s=ui.read_text(encoding='utf-8')
          if 'import android.animation.ObjectAnimator;' not in s:
              s=s.replace('import android.app.Activity;\n','import android.animation.ObjectAnimator;\nimport android.animation.StateListAnimator;\nimport android.app.Activity;\n',1)
          s=s.replace('button.setAllCaps(false);\n        button.setPadding(dp(context, 12), 0, dp(context, 12), 0);',
                      'button.setAllCaps(false);\n        button.setGravity(Gravity.CENTER);\n        button.setIncludeFontPadding(false);\n        button.setPadding(dp(context, 12), 0, dp(context, 12), 0);',1)
          s=s.replace('button.setBackground(shape(context, BLUE, BLUE, 10));','button.setBackground(gradientShape(context, Color.rgb(55, 113, 231), BLUE, BLUE_DARK, 11));',1)
          s=s.replace('button.setStateListAnimator(null);','applyFunctionalDepth(context, button);',1)
          s=s.replace('button.setBackground(shape(context, Color.WHITE, Color.rgb(190, 207, 233), 10));','button.setBackground(gradientShape(context, Color.WHITE, Color.rgb(244, 247, 252), Color.rgb(181, 199, 226), 11));',1)
          s=s.replace('button.setBackground(shape(context, Color.WHITE, Color.rgb(244, 190, 190), 9));','button.setBackground(gradientShape(context, Color.WHITE, Color.rgb(255, 246, 246), Color.rgb(235, 174, 177), 10));',1)
          s=s.replace('button.setBackground(shape(context, selected ? BLUE : Color.WHITE,\n                selected ? BLUE : LINE, 8));',
                      'button.setBackground(selected\n                ? gradientShape(context, Color.rgb(55, 113, 231), BLUE, BLUE_DARK, 9)\n                : gradientShape(context, Color.WHITE, Color.rgb(244, 247, 252), LINE, 9));\n        applyFunctionalDepth(context, button);',1)
          marker='    /** One common back control for Settings, Templates, Trash, details and other sub-pages. */\n'
          if 'public static GradientDrawable gradientShape' not in s:
              helpers='''    public static GradientDrawable gradientShape(Context context, int top, int bottom, int stroke, int radius) {
              GradientDrawable drawable = new GradientDrawable(GradientDrawable.Orientation.TOP_BOTTOM, new int[]{top, bottom});
              if (stroke != Color.TRANSPARENT) drawable.setStroke(dp(context, 1), stroke);
              drawable.setCornerRadius(dp(context, radius));
              return drawable;
          }

          public static void applyFunctionalDepth(Context context, View view) {
              if (Build.VERSION.SDK_INT < Build.VERSION_CODES.LOLLIPOP) return;
              view.setElevation(dp(context, 2));
              StateListAnimator animator = new StateListAnimator();
              ObjectAnimator pressed = ObjectAnimator.ofFloat(view, "translationZ", 0f);
              pressed.setDuration(70);
              ObjectAnimator normal = ObjectAnimator.ofFloat(view, "translationZ", dp(context, 2));
              normal.setDuration(120);
              animator.addState(new int[]{android.R.attr.state_pressed}, pressed);
              animator.addState(new int[]{}, normal);
              view.setStateListAnimator(animator);
          }

          '''
              if marker not in s: raise SystemExit('back marker missing')
              s=s.replace(marker,helpers+marker,1)
          pattern=r'    /\*\* One common back control for Settings, Templates, Trash, details and other sub-pages\. \*/\n    public static TextView backButton\(Activity activity\) \{.*?\n    \}'
          repl='''    /** One common back control for Settings, Templates, Trash, details and other sub-pages. */
          public static TextView backButton(Activity activity) {
              TextView back = new TextView(activity);
              back.setText("");
              back.setGravity(Gravity.CENTER);
              back.setPadding(0, 0, 0, 0);
              back.setIncludeFontPadding(false);
              back.setCompoundDrawablesWithIntrinsicBounds(R.drawable.ic_back, 0, 0, 0);
              back.setBackground(gradientShape(activity, Color.WHITE, Color.rgb(243, 247, 253), Color.rgb(176, 197, 226), 12));
              applyFunctionalDepth(activity, back);
              back.setClickable(true);
              back.setFocusable(true);
              back.setContentDescription("返回");
              back.setOnClickListener(view -> activity.finish());
              return back;
          }'''
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('backButton replacement failed')
          ui.write_text(s,encoding='utf-8')

          ledger=Path('app/src/main/java/cn/safetyledger/app/LedgerActivity.java')
          s=ledger.read_text(encoding='utf-8')
          s=s.replace('reset.setMinHeight(Ui.dp(this, 38));','reset.setMinHeight(Ui.dp(this, 42));')
          s=s.replace('reset.setTextSize(11.5f);','reset.setTextSize(12f);')
          s=s.replace('reset.setSingleLine(true);\n        reset.setPadding(Ui.dp(this, 5), 0, Ui.dp(this, 5), 0);','reset.setSingleLine(true);\n        reset.setGravity(Gravity.CENTER);\n        reset.setIncludeFontPadding(false);\n        reset.setPadding(Ui.dp(this, 6), 0, Ui.dp(this, 6), 0);')
          s=s.replace('new LinearLayout.LayoutParams(Ui.dp(this, 40), Ui.dp(this, 40))','new LinearLayout.LayoutParams(Ui.dp(this, 42), Ui.dp(this, 42))',2)
          s=s.replace('dateNavigation.addView(Ui.horizontalGap(this, 5));','dateNavigation.addView(Ui.horizontalGap(this, 6));')
          s=s.replace('new LinearLayout.LayoutParams(Ui.dp(this, 90), Ui.dp(this, 40))','new LinearLayout.LayoutParams(Ui.dp(this, 92), Ui.dp(this, 42))')
          s=s.replace('rangeLabel.setSingleLine(true);','rangeLabel.setSingleLine(true);\n        rangeLabel.setGravity(Gravity.CENTER);\n        rangeLabel.setIncludeFontPadding(false);',1)
          s=s.replace('Ui.dp(this, 64), Ui.dp(this, 40))','Ui.dp(this, 64), Ui.dp(this, 42))',1)
          s=s.replace('Ui.dp(this, 58), Ui.dp(this, 40))','Ui.dp(this, 64), Ui.dp(this, 42))',1)
          s=s.replace('filters.addView(Ui.horizontalGap(this, 3));','filters.addView(Ui.horizontalGap(this, 4));')
          s=s.replace('filters.addView(type, new LinearLayout.LayoutParams(0, Ui.dp(this, 40), 1));','filters.addView(type, new LinearLayout.LayoutParams(0, Ui.dp(this, 42), 1));')
          s=s.replace('filters.addView(statusFilter, new LinearLayout.LayoutParams(0, Ui.dp(this, 40), 1));','filters.addView(statusFilter, new LinearLayout.LayoutParams(0, Ui.dp(this, 42), 1));')
          s=s.replace('header.addView(multiToggle, new LinearLayout.LayoutParams(Ui.dp(this, 84), Ui.dp(this, 38)));','header.addView(multiToggle, new LinearLayout.LayoutParams(Ui.dp(this, 88), Ui.dp(this, 42)));')
          s=s.replace('header.addView(Ui.horizontalGap(this, 5));','header.addView(Ui.horizontalGap(this, 6));')
          s=s.replace('header.addView(pageSize, new LinearLayout.LayoutParams(Ui.dp(this, 134), Ui.dp(this, 40)));','header.addView(pageSize, new LinearLayout.LayoutParams(Ui.dp(this, 126), Ui.dp(this, 42)));')
          pattern=r'    private Spinner spinner\(String\[\] values\) \{.*?\n    \}'
          repl='''    private Spinner spinner(String[] values) {
              Spinner spinner = new Spinner(this);
              ArrayAdapter<String> adapter = spinnerAdapter(values);
              spinner.setAdapter(adapter);
              spinner.setGravity(Gravity.CENTER);
              spinner.setBackground(Ui.gradientShape(this, Color.WHITE, Color.rgb(245, 248, 253), Color.rgb(190, 205, 228), 11));
              spinner.setPadding(Ui.dp(this, 4), 0, Ui.dp(this, 4), 0);
              spinner.setMinimumWidth(0);
              Ui.applyFunctionalDepth(this, spinner);
              return spinner;
          }'''
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('spinner replacement failed')
          pattern=r'    private ArrayAdapter<String> spinnerAdapter\(String\[\] values\) \{.*?\n    \}'
          repl='''    private ArrayAdapter<String> spinnerAdapter(String[] values) {
              ArrayAdapter<String> adapter = new ArrayAdapter<>(this, android.R.layout.simple_spinner_item, values) {
                  @Override public View getView(int position, View convertView, ViewGroup parent) {
                      View view = super.getView(position, convertView, parent);
                      if (view instanceof TextView text) {
                          text.setTextSize(12.5f);
                          text.setSingleLine(true);
                          text.setGravity(Gravity.CENTER);
                          text.setIncludeFontPadding(false);
                          text.setTextColor(Ui.TEXT);
                          text.setPadding(Ui.dp(LedgerActivity.this, 2), 0, Ui.dp(LedgerActivity.this, 2), 0);
                      }
                      return view;
                  }
                  @Override public View getDropDownView(int position, View convertView, ViewGroup parent) {
                      View view = super.getDropDownView(position, convertView, parent);
                      if (view instanceof TextView text) {
                          text.setTextSize(14f);
                          text.setTextColor(Ui.TEXT);
                          text.setGravity(Gravity.CENTER_VERTICAL);
                          text.setPadding(Ui.dp(LedgerActivity.this, 16), Ui.dp(LedgerActivity.this, 10), Ui.dp(LedgerActivity.this, 16), Ui.dp(LedgerActivity.this, 10));
                      }
                      return view;
                  }
              };
              adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
              return adapter;
          }'''
          s,n=re.subn(pattern,repl,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('spinnerAdapter replacement failed')
          ledger.write_text(s,encoding='utf-8')

          Path('app/src/main/res/drawable/ic_back.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#154BB7" android:pathData="M15.41,7.41L14,6l-6,6 6,6 1.41,-1.41L10.83,12z" />
          </vector>
          ''',encoding='utf-8')
          g=Path('app/build.gradle')
          t=g.read_text(encoding='utf-8').replace('versionCode 29','versionCode 30').replace("versionName '1.2.26'","versionName '1.2.27'")
          g.write_text(t,encoding='utf-8')
          Path('app/VERSION_1.2.27.txt').write_text('安全检查台账 Android 1.2.27\n- 返回箭头矢量化并居中\n- 功能按钮立体化\n- 首页筛选与每页条数居中对齐\n- 不修改业务逻辑\n',encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git diff --cached --quiet && exit 0
          git commit -m 'Polish Android 1.2.27 UI alignment and depth'
          git push origin HEAD:agent/v1226-ui-sync-smoothing
