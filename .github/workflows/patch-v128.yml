name: Patch cloud sync v1.2.8

on:
  push:
    branches:
      - agent/fix-cloud-sync-ui-v128

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fix-cloud-sync-ui-v128
          fetch-depth: 0

      - name: Apply fixes
        run: python3 tools/patch_v128.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app .github/workflows/android-build.yml tools/patch_v128.py
          git add -u .github/workflows/patch-v128.yml
          git commit -m 'Release 1.2.8 cloud sync compatibility and UX'
          git push origin HEAD:agent/fix-cloud-sync-ui-v128

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk '安全检查台账-1.2.8.apk'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.8
          path: 安全检查台账-1.2.8.apk
          if-no-files-found: error
          retention-days: 30
