                    syncStatus.setText("同步状态：已同步 · 本机角色 " + role);
                    Ui.toast(this, "同步完成：接收 " + result.peerDevices()''',
              '''                    String role = "FIELD".equals(result.role()) ? "工作人员" : "管理员";
