name: Build Android 1.2.21 dynamic PDF rows

on:
  push:
    branches:
      - agent/v1220-complete-android-pc

permissions:
  contents: write

jobs:
  build:
    if: contains(github.event.head_commit.message, 'Build Android 1.2.21 with dynamic PDF rows')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply dynamic PDF row layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'missing expected text in {path}: {old[:160]!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          p='app/src/main/java/cn/safetyledger/app/pdf/PdfExporter.java'
          rep(p, '    private static final int FORM_ITEM_SLOTS = 12;\n', '')
          rep(p,
              '        int itemCount = Math.max(1, record.items.size());\n        int layoutRows = record.items.isEmpty() ? 1 : Math.max(FORM_ITEM_SLOTS, itemCount);',
              '        int itemCount = Math.max(1, record.items.size());\n        // Only render the inspection items actually selected in this record.\n        // Templates may contain up to 12 items, but unused blank rows must never appear in the formal PDF.\n        int layoutRows = itemCount;')
          rep(p,
              '            for (int blank = record.items.size(); blank < FORM_ITEM_SLOTS; blank++) {\n                for (int column = 0; column < columns.length - 1; column++) {\n                    rect(canvas, columns[column], y, columns[column + 1] - columns[column], itemHeight);\n                }\n                y += itemHeight;\n            }\n',
              '')

          p='app/build.gradle'
          rep(p, 'versionCode 23', 'versionCode 24')
          rep(p, "versionName '1.2.20'", "versionName '1.2.21'")

          Path('docs/release-1.2.21.md').write_text('''# Android 1.2.21\n\n- 模板仍允许最多 12 个检查项目。\n- 正式 PDF 只绘制当前记录实际存在的检查项目，不再为 12 项上限补空白单元格。\n- 例如实际 8 项时只显示 8 行；9 项时显示 9 行；最多 12 行。\n- 整改意见、整改记录和三方签名仍固定保留在 A4 第1页，照片继续从第2页开始。\n''', encoding='utf-8')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - name: Test lint and build release APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease
      - name: Stage unsigned APK
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk '安全检查台账-1.2.21-待永久签名.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.21-待永久签名
          path: 安全检查台账-1.2.21-待永久签名.apk
          if-no-files-found: error
          retention-days: 30
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app docs/release-1.2.21.md
          git commit -m 'Android 1.2.21 dynamic PDF item rows'
          git pull --rebase origin agent/v1220-complete-android-pc
          git push origin HEAD:agent/v1220-complete-android-pc
