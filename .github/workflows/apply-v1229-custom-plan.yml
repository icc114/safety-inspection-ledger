name: Apply Android 1.2.29 Custom Monthly Plan

on:
  push:
    branches:
      - 'agent/v1229-custom-monthly-plan'
    paths:
      - 'tools/apply-v1229.py'
      - '.github/workflows/apply-v1229-custom-plan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/v1229-custom-monthly-plan
          fetch-depth: 0
      - name: Apply 1.2.29 source migration
        run: python3 tools/apply-v1229.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test lint and build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app .github/workflows/android-build.yml
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Add editable monthly inspection plan and clearer progress overview"
          git push origin HEAD:agent/v1229-custom-monthly-plan
