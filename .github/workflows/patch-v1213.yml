name: Patch v1.2.13 device logout

on:
  push:
    branches:
      - agent/native-android-v1

permissions:
  contents: write

jobs:
  patch-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.2.13 patch
        run: python3 tools/patch_v1213.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test lint and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Collect unsigned release APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk '安全检查台账-1.2.13-unsigned.apk'
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.13-unsigned
          path: 安全检查台账-1.2.13-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Commit verified app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/build.gradle app/src/main/java/cn/safetyledger/app/sync/WebDavClient.java app/src/main/java/cn/safetyledger/app/sync/CloudSyncService.java app/src/main/java/cn/safetyledger/app/SettingsActivity.java
          git diff --cached --quiet || git commit -m 'Release 1.2.13 with device logout controls'
          git push
