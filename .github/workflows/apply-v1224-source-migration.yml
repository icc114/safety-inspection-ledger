name: Apply 1.2.24 UI Source Migration

on:
  push:
    branches:
      - 'agent/v1224-pc021-calendar-holiday'
    paths:
      - 'tools/v1224-android-ui.patch'
      - 'tools/v021-pc-preview.patch'
      - 'tools/v1224-progress-target.patch'
      - '.github/workflows/apply-v1224-source-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1224-pc021-calendar-holiday
          fetch-depth: 0
      - name: Apply approved source patches once
        shell: bash
        run: |
          set -euo pipefail
          apply_once() {
            local patch="$1"
            if git apply --check "$patch"; then
              git apply "$patch"
            elif git apply --reverse --check "$patch"; then
              echo "$patch already applied"
            else
              echo "Cannot apply or recognize $patch" >&2
              exit 1
            fi
          }
          apply_once tools/v1224-android-ui.patch
          apply_once tools/v021-pc-preview.patch
          apply_once tools/v1224-progress-target.patch
      - name: Commit migrated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/LedgerActivity.java desktop/src/main/java/cn/safetyledger/pc/RecordPreviewDialog.java desktop/src/main/java/cn/safetyledger/pc/DesktopUiPatch.java
          if git diff --cached --quiet; then
            echo "Source is already migrated."
            exit 0
          fi
          git commit -m "Apply final compact calendar progress target"
          git push origin HEAD:agent/v1224-pc021-calendar-holiday
