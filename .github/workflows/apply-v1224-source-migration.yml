name: Apply 1.2.24 UI Source Migration

on:
  push:
    branches:
      - 'agent/v1224-pc021-calendar-holiday'
    paths:
      - '.github/workflows/apply-v1224-source-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1224-pc021-calendar-holiday
          fetch-depth: 0
      - name: Finalize approved monthly progress target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path('app/src/main/java/cn/safetyledger/app/LedgerActivity.java'),
              Path('desktop/src/main/java/cn/safetyledger/pc/DesktopUiPatch.java'),
          ]
          old = 'int planned = (month.lengthOfMonth() + 6) / 7;'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if old in text:
                  text = text.replace(old, 'int planned = 4;', 1)
                  path.write_text(text, encoding='utf-8')
                  print(f'Updated {path}')
              elif 'int planned = 4;' in text:
                  print(f'Already updated {path}')
              else:
                  raise SystemExit(f'Expected monthly progress expression not found in {path}')
          PY
      - name: Commit finalized source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/LedgerActivity.java desktop/src/main/java/cn/safetyledger/pc/DesktopUiPatch.java
          if git diff --cached --quiet; then
            echo "Source is already finalized."
            exit 0
          fi
          git commit -m "Use four monthly weekly inspection targets"
          git push origin HEAD:agent/v1224-pc021-calendar-holiday
