name: Patch v1.2.9 foundation

on:
  push:
    branches:
      - agent/v129-storage-signing-foundation

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply v1.2.9 patch
        run: python3 tools/patch_v129.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test lint build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Commit verified app source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/cn/safetyledger/app/security/SecretStore.java \
                  app/src/main/java/cn/safetyledger/app/sync/CloudSyncScheduler.java \
                  app/src/main/java/cn/safetyledger/app/data/LedgerRepository.java \
                  app/src/main/java/cn/safetyledger/app/LedgerActivity.java \
                  app/src/main/java/cn/safetyledger/app/pdf/PdfExporter.java \
                  app/src/main/java/cn/safetyledger/app/SettingsActivity.java \
                  app/build.gradle
          git diff --cached --quiet || git commit -m 'Release 1.2.9 storage and keystore foundation'
          git push
      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk '安全检查台账-1.2.9-debug.apk'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.9-debug
          path: 安全检查台账-1.2.9-debug.apk
          retention-days: 30
