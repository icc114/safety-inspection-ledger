name: Finalize Android 1.2.25 UI

on:
  push:
    branches:
      - 'agent/v1225-ui-sync-diagnostics'
    paths:
      - 'tools/fix_v1225_settings_literal.py'
      - '.github/workflows/fix-v1225-java.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1225-ui-sync-diagnostics
          fetch-depth: 0
      - name: Repair sync diagnostics Java string
        run: python3 tools/fix_v1225_settings_literal.py
      - name: Commit repaired source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/SettingsActivity.java
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git commit -m "Fix sync diagnostics message compilation"
          git push origin HEAD:agent/v1225-ui-sync-diagnostics
