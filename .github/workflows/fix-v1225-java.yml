name: Fix 1.2.25 Java Escape

on:
  push:
    branches:
      - 'agent/v1225-ui-sync-diagnostics'
    paths:
      - 'tools/fix_v1225_java.py'
      - '.github/workflows/fix-v1225-java.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1225-ui-sync-diagnostics
          fetch-depth: 0
      - name: Fix escaped newline
        run: python3 tools/fix_v1225_java.py
      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/cn/safetyledger/app/LedgerActivity.java
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix progress title newline escape"
          git push origin HEAD:agent/v1225-ui-sync-diagnostics
