name: Android APK Build

on:
  push:
    branches:
      - agent/v1233-final-progress-dashboard
  pull_request:
    branches:
      - agent/v1233-final-progress-dashboard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAFETY_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SAFETY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SAFETY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SAFETY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore permanent release keystore
        if: env.SAFETY_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$SAFETY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safety-release.jks"
          echo "SAFETY_KEYSTORE_PATH=$RUNNER_TEMP/safety-release.jks" >> "$GITHUB_ENV"
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test, lint and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk '安全检查台账-1.2.40-debug-仅供测试.apk'
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.40-debug
          path: 安全检查台账-1.2.40-debug-仅供测试.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package unsigned Release APK and signing tools
        if: github.event_name == 'pull_request'
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk '安全检查台账-1.2.40-release-unsigned.apk'
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - name: Upload unsigned Release APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.40-release-unsigned
          path: 安全检查台账-1.2.40-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload signing tools
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-linux-signing
          path: signing-tools/
          if-no-files-found: error
          retention-days: 7
      - name: Require permanent signing for official release
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/v1233-final-progress-dashboard' && contains(github.event.head_commit.message, '[release v1.2.40]')
        run: |
          test -n "$SAFETY_KEYSTORE_BASE64" || { echo "::error::缺少 SAFETY_KEYSTORE_BASE64，禁止发布临时签名 APK"; exit 1; }
          test -n "$SAFETY_KEYSTORE_PASSWORD" || { echo "::error::缺少 SAFETY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SAFETY_KEY_ALIAS" || { echo "::error::缺少 SAFETY_KEY_ALIAS"; exit 1; }
          test -n "$SAFETY_KEY_PASSWORD" || { echo "::error::缺少 SAFETY_KEY_PASSWORD"; exit 1; }
          test -f app/build/outputs/apk/release/app-release.apk || { echo "::error::未生成永久签名 Release APK"; exit 1; }
      - name: Verify and name official APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/v1233-final-progress-dashboard' && contains(github.event.head_commit.message, '[release v1.2.40]')
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk '安全检查台账-v1.2.40.apk'
          sha256sum '安全检查台账-v1.2.40.apk' > '安全检查台账-v1.2.40.apk.sha256'
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/v1233-final-progress-dashboard' && contains(github.event.head_commit.message, '[release v1.2.40]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.40
          name: 安全检查记录簿 v1.2.40（自然手指签名版）
          target_commitish: agent/v1233-final-progress-dashboard
          make_latest: true
          body: |
            ## 本版更新
            - 手指签名加入自适应轨迹平滑：慢写更稳，快速连笔减少拖尾和滞后。
            - 线宽改为结合短时速度、减速、转折和下行方向计算，快速笔画更细，转折和减速处自然加重。
            - 主体线宽约 1.55dp～3.75dp，起笔 1.05dp、收笔 0.85dp，保留签字笔感但避免毛笔化。
            - 手写笔仍可轻微参考真实压力；手指书写主要依赖运动特征模拟笔压。
            - 签名裁切改为绘制时实时记录边界，保存时不再逐像素扫描整张横屏位图，降低确认签名时的卡顿和内存占用。
            - PDF、同步、备份及旧签名数据格式保持兼容。

            此 APK 仅在永久签名密钥校验通过后发布，可覆盖安装后续同签名版本。
          files: |
            安全检查台账-v1.2.40.apk
            安全检查台账-v1.2.40.apk.sha256
