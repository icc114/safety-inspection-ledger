name: Android APK Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test, lint and build APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk '安全检查台账-1.2.8.apk'
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.8
          path: 安全检查台账-1.2.8.apk
          if-no-files-found: error
          retention-days: 30
