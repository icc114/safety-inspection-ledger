name: Android APK Build

on:
  push:
    branches:
      - agent/v1233-final-progress-dashboard
  pull_request:
    branches:
      - agent/v1233-final-progress-dashboard
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAFETY_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      SAFETY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SAFETY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SAFETY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore permanent release keystore
        if: env.SAFETY_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$SAFETY_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safety-release.jks"
          echo "SAFETY_KEYSTORE_PATH=$RUNNER_TEMP/safety-release.jks" >> "$GITHUB_ENV"
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test, lint and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Name debug APK
        run: cp app/build/outputs/apk/debug/app-debug.apk 'Safety-Ledger-1.2.40-debug.apk'
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Safety-Ledger-1.2.40-debug
          path: Safety-Ledger-1.2.40-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Package PR Release APK
        if: github.event_name == 'pull_request'
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk 'Safety-Ledger-1.2.40-release-test.apk'
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk 'Safety-Ledger-1.2.40-release-test.apk'
          else
            echo "::error::未找到 Release APK"
            exit 1
          fi
      - name: Upload PR Release APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Safety-Ledger-1.2.40-release-test
          path: Safety-Ledger-1.2.40-release-test.apk
          if-no-files-found: error
          retention-days: 7
      - name: Require permanent signing for official release
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/v1233-final-progress-dashboard' && contains(github.event.head_commit.message, '[release v1.2.40]')
        run: |
          test -n "$SAFETY_KEYSTORE_BASE64" || { echo "::error::缺少 SAFETY_KEYSTORE_BASE64，禁止发布临时签名 APK"; exit 1; }
          test -n "$SAFETY_KEYSTORE_PASSWORD" || { echo "::error::缺少 SAFETY_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$SAFETY_KEY_ALIAS" || { echo "::error::缺少 SAFETY_KEY_ALIAS，禁止发布临时签名 APK"; exit 1; }
          test -n "$SAFETY_KEY_PASSWORD" || { echo "::error::缺少 SAFETY_KEY_PASSWORD，禁止发布临时签名 APK"; exit 1; }
          test -f app/build/outputs/apk/release/app-release.apk || { echo "::error::未生成永久签名 Release APK"; exit 1; }
      - name: Verify and name official APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/v1233-final-progress-dashboard' && contains(github.event.head_commit.message, '[release v1.2.40]')
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk 'Safety-Ledger-v1.2.40.apk'
          sha256sum 'Safety-Ledger-v1.2.40.apk' > 'Safety-Ledger-v1.2.40.apk.sha256'
      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/v1233-final-progress-dashboard' && contains(github.event.head_commit.message, '[release v1.2.40]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.40
          name: 安全检查记录簿 v1.2.40（自然手指签名版）
          target_commitish: agent/v1233-final-progress-dashboard
          make_latest: true
          body: |
            ## 本版更新
            - 保留 v1.2.39 的离线优先、多手机轻量同步、待上传保护和 IPv4 网络稳定性优化。
            - 手指签名加入自适应轨迹平滑：慢速书写更稳，快速连笔降低滤波拖尾。
            - 使用短时速度、减速趋势、转折和下行方向共同模拟笔压；快速笔画更细，转折和减速处自然加重。
            - 主体线宽约 1.55dp～3.75dp，起笔约 1.05dp、收笔约 0.85dp，增强真实签字笔感但避免毛笔化。
            - 线宽变细响应更快、变粗更克制，减少停顿处粗块；抬手末端做路径约束，降低小钩和突然偏移。
            - 签名裁切改为绘制时实时记录墨迹边界，不再逐像素扫描整张横屏位图，降低确认签名时的卡顿和临时内存占用。
            - 透明 PNG、10dp 边距、PDF、同步、备份和旧签名数据继续兼容。

            此 APK 仅在永久签名密钥校验通过后发布，可覆盖安装后续同签名版本。
          files: |
            Safety-Ledger-v1.2.40.apk
            Safety-Ledger-v1.2.40.apk.sha256
