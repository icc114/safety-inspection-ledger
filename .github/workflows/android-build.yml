name: Android APK Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Grant Gradle permission
        run: chmod +x gradlew
      - name: Test, lint and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Name APKs and package signing tools
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk '安全检查台账-1.2.31-debug-不可作为长期升级包.apk'
          cp app/build/outputs/apk/release/app-release-unsigned.apk '安全检查台账-1.2.31-release-unsigned.apk'
          mkdir -p signing-tools/lib
          cp "$ANDROID_HOME/build-tools/35.0.0/apksigner" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" signing-tools/
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner signing-tools/zipalign
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.31-debug
          path: 安全检查台账-1.2.31-debug-不可作为长期升级包.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: 安全检查台账-1.2.31-release-unsigned
          path: 安全检查台账-1.2.31-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload Linux Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-linux-signing
          path: signing-tools/
          if-no-files-found: error
          retention-days: 7
