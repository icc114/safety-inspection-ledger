name: Apply Android 1.2.29 Compile Fix

on:
  push:
    branches:
      - 'agent/v1229-custom-monthly-plan'
    paths:
      - 'tools/fix-v1229-compile.py'
      - '.github/workflows/apply-v1229-compile-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1229-custom-monthly-plan
          fetch-depth: 0
      - run: python3 tools/fix-v1229-compile.py
      - name: Commit app source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix 1.2.29 text-size compile compatibility"
          git push origin HEAD:agent/v1229-custom-monthly-plan
