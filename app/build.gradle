plugins { id 'com.android.application' }

def stableKeystorePath = System.getenv('SAFETY_KEYSTORE_PATH')
def stableKeystorePassword = System.getenv('SAFETY_KEYSTORE_PASSWORD')
def stableKeyAlias = System.getenv('SAFETY_KEY_ALIAS')
def stableKeyPassword = System.getenv('SAFETY_KEY_PASSWORD')
def stableSigningReady = stableKeystorePath && stableKeystorePassword && stableKeyAlias && stableKeyPassword

android {
    namespace 'cn.safetyledger.app'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.safetyledger.app'
        minSdk 26
        targetSdk 35
        versionCode 35
        versionName '1.2.32'
        testInstrumentationRunner 'android.app.InstrumentationTestRunner'
    }

    signingConfigs {
        stableRelease {
            if (stableSigningReady) {
                storeFile file(stableKeystorePath)
                storePassword stableKeystorePassword
                keyAlias stableKeyAlias
                keyPassword stableKeyPassword
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug { applicationIdSuffix '' }
        release {
            minifyEnabled false
            if (stableSigningReady) signingConfig signingConfigs.stableRelease
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
